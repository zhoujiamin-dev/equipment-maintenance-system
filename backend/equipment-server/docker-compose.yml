services:
  mysql:
    image: mysql:8.0
    container_name: equipment-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: equipment_db
    ports:
      - "3310:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./equipment_db.sql:/docker-entrypoint-initdb.d/equipment_db.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: equipment-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: equipment-pgvector
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD}
      POSTGRES_DB: equipment_rag
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d equipment_rag"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: .
    image: equipment-server:1.0
    container_name: equipment-server
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/equipment_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}

      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      JWT_SECRET: ${JWT_SECRET}

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      PGVECTOR_DATASOURCE_URL: jdbc:postgresql://pgvector:5432/equipment_rag
      PGVECTOR_DATASOURCE_USERNAME: postgres
      PGVECTOR_DATASOURCE_PASSWORD: ${PGVECTOR_PASSWORD}
      PGVECTOR_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver

      EMBEDDING_URL: http://host.docker.internal:8001/embed

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgvector:
        condition: service_healthy

volumes:
  mysql_data:
  pgvector_data: